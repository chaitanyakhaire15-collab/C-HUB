<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
       .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 50px auto; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
       .btn { background: #2c3e50; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<p style="color:red;">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
        <form method="POST">
            <input name="password" type="password" placeholder="Enter Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
